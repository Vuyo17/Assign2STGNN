# Q3: AGCRN, tsl's own default AGCRNModel hyperparameters (see code/API_NOTES.md):
# hidden_size=64, emb_size=10, n_layers=1. lr/batch size/optimiser identical to
# every other experiment so architecture is the only varying factor.
#
# Epoch budget: max_epochs is intentionally set generously with early stopping
# (same patience as every other model) for the epoch-SELECTION run described in
# the assignment (Q3 "determine a sensible/optimal number of epochs before the
# final experiment"). The chosen epoch count is justified from that run's
# validation curve (results/agcrn/epoch_selection.json,
# results/agcrn/training_history.json) rather than picked arbitrarily -- see
# report Section 5.1. AGCRN has no predefined-graph forward path at all (see
# code/models/agcrn.py), so it is NOT part of the TTS/GWN adjacency-consistency
# comparison, only of the accuracy/timing/convergence comparisons.
experiment_name: agcrn
display_name: "AGCRN"

data:
  window: 12
  horizon: 12
  stride: 1
  val_len: 0.1
  test_len: 0.2
  batch_size: 64
  connectivity_threshold: 0.1
  connectivity_include_self: false
  connectivity_normalize_axis: 1
  scaler_axis: [0, 1]

model:
  hidden_size: 64
  emb_size: 10
  n_layers: 1

optim:
  lr: 0.001
  optimizer: Adam

trainer:
  # REVISED under a hard deadline (submission due 2026-08-17 10:00, config set
  # 2026-08-16 ~17:15, ~17h available). Real CPU pilot: ~15.0 min/epoch
  # single-process -- at max_epochs=25 that's a ~6.25h single-process worst
  # case. This run doubles as the epoch-SELECTION experiment itself (generous-
  # enough ceiling + early stopping), with the chosen/justified epoch count
  # read off its actual validation curve afterwards
  # (results/agcrn/training_history.json) rather than run twice.
  # FURTHER REVISED: thread-oversubscription fix (code/experiments/train.py)
  # + extra epoch-budget safety margin under 4-way concurrent execution
  # (observed 2.8x slowdown for TTS before the fix; budget sized conservatively
  # assuming the fix only partially recovers throughput).
  # FURTHER REVISED AGAIN -- see gwn_predefined.yaml (real 4.1x contention
  # factor, TTS killed to leave 3 concurrent processes).
  max_epochs: 10
  early_stopping_patience: 5
  early_stopping_monitor: val_mae
  accelerator: cpu
  devices: 1

seed: 42

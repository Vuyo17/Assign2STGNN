# Q2 Config A: GraphWaveNet, predefined graph ONLY (learned_adjacency=False).
# Model hyperparameters are tsl's own defaults for GraphWaveNetModel (see
# code/API_NOTES.md, generated from the installed tsl==0.9.5 source) -- only
# `learned_adjacency` is set explicitly, everything else is the tsl default.
# lr/batch size/optimiser are kept identical to every other experiment
# (code/configs/tts.yaml, gwn_adaptive.yaml, agcrn.yaml) so architecture is the
# only varying factor across models.
experiment_name: gwn_predefined
display_name: "GWN (predefined)"

data:
  window: 12
  horizon: 12
  stride: 1
  val_len: 0.1
  test_len: 0.2
  batch_size: 64
  connectivity_threshold: 0.1
  connectivity_include_self: false
  connectivity_normalize_axis: 1
  scaler_axis: [0, 1]

model:
  learned_adjacency: false
  # all other GraphWaveNetModel args left at tsl defaults:
  # hidden_size=32, ff_size=256, n_layers=8, temporal_kernel_size=2,
  # spatial_kernel_size=2, emb_size=10, dilation=2, dilation_mod=2,
  # norm=batch, dropout=0.3

optim:
  lr: 0.001
  optimizer: Adam

trainer:
  # REVISED under a hard deadline (submission due 2026-08-17 10:00, this config
  # set at 2026-08-16 ~17:15, ~17h available). Real CPU pilot:
  # ~33.9 min/epoch single-process (results/timing_pilot.json). At max_epochs=12
  # that's a ~6.8h single-process worst case, well inside the deadline even
  # without early stopping firing, and leaves buffer for evaluation/report/
  # packaging. This is a deliberate, documented computational+time-budget
  # limitation (see report Section 2 / Section 4.3) -- NOT the epoch count that
  # would be used given unlimited time (the original plan was max_epochs=30).
  # FURTHER REVISED: running all 4 experiments concurrently on this 20-core CPU
  # caused thread oversubscription (observed TTS epoch time 2.0min isolated ->
  # 5.6min under 4-way contention, a 2.8x slowdown). Fixed by capping each
  # process to ~5 threads (code/experiments/train.py); epoch budget still cut
  # further as a safety margin against the fix only partially recovering
  # throughput. Kept IDENTICAL to gwn_adaptive.yaml's budget so the two
  # configs remain a controlled ablation.
  # FURTHER REVISED AGAIN: real observed contention (TTS steady-state epoch
  # time 495s vs isolated pilot 120s = 4.1x, not the 1.9x seen in the noisy
  # first epoch) meant even the 6-epoch budget risked overrun. TTS was killed
  # (using its 3-epoch checkpoint as-is) to leave only 3 concurrent processes
  # sharing this 14-physical/20-logical-core (6P+8E hybrid) CPU, and this
  # budget cut further as a hard safety measure.
  max_epochs: 4
  early_stopping_patience: 3
  early_stopping_monitor: val_mae
  accelerator: cpu
  devices: 1

seed: 42

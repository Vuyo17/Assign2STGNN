# Q2 Config B: GraphWaveNet, predefined graph + learned adaptive adjacency
# (learned_adjacency=True). Identical to gwn_predefined.yaml in every other
# respect -- this is a controlled ablation of the adaptive-adjacency component.
experiment_name: gwn_adaptive
display_name: "GWN (predefined+adaptive)"

data:
  window: 12
  horizon: 12
  stride: 1
  val_len: 0.1
  test_len: 0.2
  batch_size: 64
  connectivity_threshold: 0.1
  connectivity_include_self: false
  connectivity_normalize_axis: 1
  scaler_axis: [0, 1]

model:
  learned_adjacency: true
  emb_size: 10   # tsl default; size of the learned source/target node embeddings
  # all other GraphWaveNetModel args left at tsl defaults (see gwn_predefined.yaml)

optim:
  lr: 0.001
  optimizer: Adam

trainer:
  # REVISED under a hard deadline -- see gwn_predefined.yaml for full reasoning
  # (submission due 2026-08-17 10:00, config set 2026-08-16 ~17:15). Real CPU
  # pilot: ~37.6 min/epoch single-process. Kept IDENTICAL epoch budget/patience
  # to gwn_predefined.yaml so the two GWN configs remain a controlled ablation
  # (only learned_adjacency differs) even under the tighter time budget.
  # FURTHER REVISED: see gwn_predefined.yaml -- thread-oversubscription fix +
  # extra epoch-budget safety margin under 4-way concurrent execution.
  max_epochs: 6
  early_stopping_patience: 4
  early_stopping_monitor: val_mae
  accelerator: cpu
  devices: 1

seed: 42
